<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Chris Sebastian Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thankyou {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--sage);
    }
    .thankyou__label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    .thankyou__title {
      font-family: var(--font-mono);
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 400;
      text-transform: uppercase;
      color: var(--brown);
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    .thankyou__body {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-muted);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="header__logo">Chris Sebastian Media</a>
      <nav class="header__nav">
        <a href="index.html#story">Our Story</a>
        <a href="index.html#services">Services</a>
        <a href="work.html">Work</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="header__social">
        <a href="https://www.instagram.com/dirty_seabas" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none"/>
          </svg>
        </a>
        <a href="https://www.tiktok.com/@mustysebs" target="_blank" rel="noopener" aria-label="TikTok">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.79 1.54V6.79a4.85 4.85 0 0 1-1.02-.1z"/>
          </svg>
        </a>
      </div>
      <button class="header__toggle" id="headerToggle" aria-label="Toggle menu">
        <span></span><span></span>
      </button>
    </div>
    <div class="header__mobile" id="headerMobile">
      <a href="index.html#story" class="header__mobile-link">Our Story</a>
      <a href="index.html#services" class="header__mobile-link">Services</a>
      <a href="work.html" class="header__mobile-link">Work</a>
      <a href="index.html#contact" class="header__mobile-link">Contact</a>
    </div>
  </header>

  <div class="thankyou">
    <p class="thankyou__label">Message Received</p>
    <h1 class="thankyou__title">Thank You</h1>
    <p class="thankyou__body">We'll be in touch soon. In the meantime, take a look at some of our recent work.</p>
    <a href="work.html" class="btn">View Our Work</a>
  </div>

  <script src="main.js"></script>
</body>
</html>
